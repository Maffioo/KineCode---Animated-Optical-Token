name: Release & Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'packages/kinecode/**'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Prevent infinite loops from automated version bump commits
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundles
        run: npm run build

      - name: Bump version, tag, and push to GitHub
        id: version_bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "${{ github.event.inputs.bump }}" ]; then
            BUMP="${{ github.event.inputs.bump }}"
          elif git log -1 --pretty=%B | grep -qiE "^feat(\(.*\))?:"; then
            BUMP="minor"
          else
            BUMP="patch"
          fi

          NEW_VERSION=$(npm version $BUMP --workspace=kinecode --no-git-tag-version | tail -n 1 | sed 's/^v//')
          npm version $NEW_VERSION --no-git-tag-version --allow-same-version
          cp README.md LICENSE packages/kinecode/
          git add package.json package-lock.json packages/kinecode/package.json packages/kinecode/README.md packages/kinecode/LICENSE
          git commit -m "chore(release): v$NEW_VERSION [skip ci]"
          git tag "v$NEW_VERSION"
          git push origin HEAD:main --follow-tags
          echo "new_tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_bump.outputs.new_tag }}
          generate_release_notes: true

      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace=kinecode --access public
